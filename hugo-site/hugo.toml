baseURL = "https://lamusica.fm/"
locale = "es-CO"
defaultContentLanguage = "es"
title = "LaMúsica.fm"
paginate = 12
enableRobotsTXT = true
enableGitInfo = false

# Los cuerpos exportados de WordPress se conservan tal cual, así que el HTML crudo debe renderizarse.
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[taxonomies]
  category = "categories"
  tag = "tags"

# Las imágenes de los posts viven en static/wp-content/uploads.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"

[params]
  description = "LaMúsica.fm conecta música, derechos, proyectos, empresas y ciudad."
  logo = "/brand/logo-lamusica.png"
  ogImage = "/brand/logo-lamusica.png"
  # Destino del formulario: lo resuelve el servidor, nunca el JavaScript público.
  contactEndpoint = "/api/contacto"

[permalinks]
  posts = "/:slug/"

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5

# El marcado heredado de Divi rompe el minificador de HTML.
# CSS y JS sí se minifican en el pipeline de assets.
[minify]
  disableHTML = true
