{{- $site := hugo.Data.site.site -}}
{{- $description := .Params.description | default .Description | default .Site.Params.description -}}
{{- $title := cond .IsHome $site.name (printf "%s · %s" .Title $site.name) -}}
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ if .Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}
<meta property="og:type" content="{{ cond (eq .Type "posts") "article" "website" }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="es_CO">
<meta property="og:site_name" content="{{ $site.name }}">
<meta property="og:image" content="{{ (.Params.featured_image | default .Site.Params.ogImage) | absURL }}">
<meta name="twitter:card" content="summary_large_image">
