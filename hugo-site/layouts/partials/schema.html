{{- $site := hugo.Data.site.site -}}
<script type="application/ld+json">
{{ if .IsHome }}
{{ dict
  "@context" "https://schema.org" "@type" "Organization"
  "name" $site.legalName "alternateName" $site.name
  "url" $site.productionUrl "logo" (.Site.Params.logo | absURL)
  "address" (dict "@type" "PostalAddress" "streetAddress" $site.address "addressLocality" "Medellín" "addressCountry" "CO")
  "taxID" $site.nit
  | jsonify | safeJS }}
{{ else if eq .Layout "servicedetailpage" }}
{{- $service := index (index hugo.Data.site.services.families .Params.familyIndex).services .Params.serviceIndex -}}
{{ dict
  "@context" "https://schema.org" "@type" "Service"
  "name" $service.name "description" $service.copy
  "url" .Permalink
  "provider" (dict "@type" "Organization" "name" $site.legalName "url" $site.productionUrl)
  | jsonify | safeJS }}
{{ else if eq .Type "posts" }}
{{ dict
  "@context" "https://schema.org" "@type" "Article"
  "headline" .Title "datePublished" (.Date.Format "2006-01-02") "dateModified" (.Lastmod.Format "2006-01-02")
  "url" .Permalink
  "publisher" (dict "@type" "Organization" "name" $site.legalName)
  | jsonify | safeJS }}
{{ else }}
{{ dict
  "@context" "https://schema.org" "@type" "BreadcrumbList"
  "itemListElement" (slice
    (dict "@type" "ListItem" "position" 1 "name" "Inicio" "item" ($site.productionUrl | printf "%s/"))
    (dict "@type" "ListItem" "position" 2 "name" .Title "item" .Permalink))
  | jsonify | safeJS }}
{{ end }}
</script>
