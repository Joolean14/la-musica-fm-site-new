# Staging protegido y no indexable.
# Se construye con HUGO_ENV=staging para que robots.txt bloquee todo el sitio.

server {
  listen 443 ssl http2;
  server_name staging.lamusica.fm;

  root /var/www/lamusica-staging/public;
  index index.html;

  auth_basic "Staging LaMúsica.fm";
  auth_basic_user_file /etc/nginx/.htpasswd-lamusica;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  include /var/www/lamusica-staging/server/redirects.nginx.conf;

  location = /api/contacto {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/lamusica-staging/server/contacto.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
  }

  location / { try_files $uri $uri/ $uri/index.html =404; }
  error_page 404 /404.html;
}
