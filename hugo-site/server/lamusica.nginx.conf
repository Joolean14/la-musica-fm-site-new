# Configuración de referencia para servir el sitio estático de LaMúsica.fm.
# Ajustar rutas y certificados al servidor real antes de usarla.

server {
  listen 443 ssl http2;
  server_name lamusica.fm www.lamusica.fm;

  root /var/www/lamusica/public;
  index index.html;

  # ssl_certificate      /ruta/fullchain.pem;
  # ssl_certificate_key  /ruta/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Redirecciones 301 generadas desde data/redirects.csv.
  include /var/www/lamusica/server/redirects.nginx.conf;

  # Receptor del formulario. Las credenciales llegan por variables de entorno.
  location = /api/contacto {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/lamusica/server/contacto.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(css|js|woff2|avif|webp|png|jpg|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /404.html;
}

server {
  listen 80;
  server_name lamusica.fm www.lamusica.fm;
  return 301 https://lamusica.fm$request_uri;
}
